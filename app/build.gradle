plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'dev.darkaxt.dualplay'
    compileSdk {
        version = release(37) { minorApiLevel = 1 }
    }
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId 'dev.darkaxt.dualplay'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.2.0-stage3'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation project(':libretrodroid')
    // DualDex on the bottom display, in-process (external/DualScreenDex).
    implementation project(':companion-android')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.1'

    // ROM archives: 7z (LZMA/LZMA2 through xz) and zip.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
}
